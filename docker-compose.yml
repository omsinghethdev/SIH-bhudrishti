# BhuDrishti 3D — full stack.
#
#   docker compose up -d --build        # postgres + api + nginx on :80
#   docker compose logs -f backend
#   docker compose down                 # add -v to wipe the database volume
#
# Copy .env.example to .env first and set JWT_SECRET and POSTGRES_PASSWORD.

name: bhudrishti

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhudrishti}
      POSTGRES_USER: ${POSTGRES_USER:-bhudrishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhudrishti} -d ${POSTGRES_DB:-bhudrishti}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published: only the backend needs to reach it.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bhudrishti}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bhudrishti}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      # Same origin as the frontend, so CORS is only a fallback for direct API use.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost,http://127.0.0.1}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      SEED_ON_START: ${SEED_ON_START:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "8000"
    # Uncomment to hit the API directly from the host while debugging.
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      # Empty = call our own origin through the nginx proxy. Set this only if
      # the API is hosted on a separate domain.
      API_BASE_URL: ${API_BASE_URL:-}
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db_data:
  uploads_data:
