# BhuDrishti 3D — static frontend + reverse proxy to the FastAPI backend.
# Serving both from one origin means the browser never makes a cross-origin
# call, so CORS and mixed-content problems disappear behind an AWS ALB too.

upstream bhudrishti_api {
    server ${BACKEND_HOST}:${BACKEND_PORT};
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Must be >= MAX_UPLOAD_MB on the backend, otherwise nginx rejects the
    # survey upload with a 413 before FastAPI ever sees it.
    client_max_body_size ${MAX_UPLOAD_MB}m;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # config.js is generated per-container, never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass         http://bhudrishti_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Uploaded survey files are stored as /uploads/<name> by the backend.
    location /uploads/ {
        proxy_pass       http://bhudrishti_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI's interactive docs, handy while demoing.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass       http://bhudrishti_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
